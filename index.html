<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet Pêche JP · V6.1 Terrain UX</title>
<meta name="theme-color" content="#0F1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1720; --surface:#172233; --surface-2:#1E2C40;
    --accent:#E8A33D; --accent-dim:#8A6A34;
    --text:#EDEEF0; --text-muted:#8B97A8; --flag:#C4694F; --ok:#5FA87A;
    --border:rgba(232,163,61,0.16);
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'IBM Plex Sans', system-ui, sans-serif; min-height:100vh; overscroll-behavior-y:none;}
  h1,h2,h3{font-family:'Fraunces', serif; font-optical-sizing:auto; letter-spacing:-0.01em;}
  button{font-family:inherit;}

  header{position:sticky; top:0; z-index:10; padding:calc(16px + var(--safe-top)) 18px 14px;
    background:linear-gradient(180deg, var(--bg) 60%, rgba(15,23,32,0.94)); border-bottom:1px solid var(--border);}
  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); margin:0 0 4px;}
  header h1{font-size:24px; font-weight:600; margin:0 0 2px;}
  header .sub{color:var(--text-muted); font-size:13px; margin:0;}
  .back-row{display:flex; align-items:center; gap:10px;}
  .back-btn{all:unset; cursor:pointer; color:var(--accent); font-size:20px; line-height:1; padding:4px 6px 4px 0;}

  main{padding:16px 18px calc(40px + var(--safe-bottom));}

  .home-section{margin-top:26px;}
  .home-section:first-child{margin-top:4px;}
  .home-section-title{font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.07em;
    color:var(--accent); font-family:'IBM Plex Mono', monospace; margin:0 0 12px;}

  .pad-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;}
  .pad{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; cursor:pointer;}
  .pad.open{border-color:var(--accent); background:var(--surface-2);}
  .pad .pad-title{font-family:'Fraunces', serif; font-weight:600; font-size:14px; line-height:1.25;}
  .pad .pad-sub{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--text-muted); margin-top:5px;}
  .pad.active-port .pad-sub::before{content:"◉ "; color:var(--ok);}

  .pad-detail{grid-column:1 / -1; background:var(--surface-2); border:1px solid var(--accent); border-radius:12px; padding:13px 14px; margin-top:-2px; font-size:13px;}
  .pad-detail .k{font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; color:var(--text-muted); margin:8px 0 5px;}
  .pad-detail .k:first-child{margin-top:0;}
  .pad-detail .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .pad-detail .chip{background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px 10px; font-size:12px;}
  .chip-empty{font-size:12px; color:var(--text-muted); font-style:italic;}
  .pad-detail .chip.linkable{color:var(--accent); cursor:pointer; border-color:var(--accent);}

  .tide-now{display:flex; align-items:center; gap:10px; margin:6px 0;}
  .tide-state{font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--accent);}
  .tide-next{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-muted);}
  .tide-curve{width:100%; height:52px; margin-top:6px;}
  .tide-source{font-family:'IBM Plex Mono', monospace; font-size:9.5px; line-height:1.45; color:var(--text-muted); margin:6px 0 2px;}
  .tide-source strong{color:var(--ok); font-weight:600;}
  .tide-warning{background:rgba(196,105,79,0.10); border:1px solid rgba(196,105,79,0.35); border-radius:8px; padding:8px 9px; color:#d69a89; font-size:11.5px; line-height:1.45; margin-top:7px;}
  .tide-days{display:flex; gap:7px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none;}
  .tide-days::-webkit-scrollbar{display:none;}
  .tide-day{min-width:74px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:8px 9px; cursor:pointer; text-align:left;}
  .tide-day.on{border-color:var(--accent); background:rgba(232,163,61,0.10);}
  .tide-day .d{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--text-muted);}
  .tide-day .score{font-family:'Fraunces',serif; font-size:16px; color:var(--accent); margin-top:2px;}
  .tide-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:3px 0 8px;}
  .tide-nav button{background:var(--surface); color:var(--accent); border:1px solid var(--border); border-radius:9px; padding:7px 10px; cursor:pointer;}
  .tide-nav button:disabled{opacity:.3; cursor:default;}
  .tide-scorebox{display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:10px 11px; margin:7px 0;}
  .tide-scorebig{font-family:'Fraunces',serif; font-size:25px; line-height:1; color:var(--accent); min-width:48px;}
  .tide-scoretxt{font-size:12px; line-height:1.45; color:var(--text-muted);}
  .sun-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin:7px 0;}
  .sun-chip{background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:7px 4px; text-align:center;}
  .sun-chip .lab{font-family:'IBM Plex Mono',monospace; font-size:8.5px; color:var(--text-muted); text-transform:uppercase;}
  .sun-chip .tm{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text); margin-top:2px;}
  .dest-section{margin-top:22px; padding-top:16px; border-top:1px solid var(--border);}
  .dest-targets{margin:8px 0 10px;}
  .dest-targets .lab{font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;}
  .dest-summary{display:flex; flex-direction:column; gap:8px; margin-top:7px;}
  .dest-row{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 11px; line-height:1.5;}
  .dest-row .lab{font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase; color:var(--accent); margin-bottom:4px;}
  .spot-line{margin:4px 0;}
  .spot-line strong{color:var(--text);}
  .intel-details{margin-top:9px;}
  .intel-details summary{cursor:pointer; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:10px;}
  .intel-list{display:flex; flex-direction:column; gap:7px; margin-top:7px;}
  .intel-item{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 10px; font-size:12.3px; line-height:1.5;}
  .intel-meta{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:4px;}
  .intel-cat{font-family:'IBM Plex Mono', monospace; font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent);}
  .intel-conf{font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--ok);}
  .intel-src{font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--text-muted); margin-top:5px;}

  .brief-box{background:var(--surface); border-left:3px solid var(--accent); border-radius:0 10px 10px 0; padding:11px 12px; margin-top:8px; font-size:12.8px; line-height:1.55;}
  .brief-box .obs-ref{color:var(--accent); font-family:'IBM Plex Mono', monospace; font-size:11px;}
  .brief-h1{font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--text); margin-bottom:4px;}
  .brief-h{font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--accent); margin:12px 0 5px;}
  .brief-ul{margin:0 0 4px; padding-left:16px;}
  .brief-ul li{margin-bottom:5px;}
  .brief-box p{margin:0 0 6px;}
  .brief-box em{color:var(--text-muted); font-style:italic;}

  .session-btn{display:block; width:100%; text-align:center; background:var(--surface); border:1px solid var(--accent); color:var(--accent); border-radius:10px; padding:10px; font-size:13px; font-weight:600; cursor:pointer; margin-top:10px;}

  .species-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;}
  .species-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 14px; cursor:pointer; text-align:center;}
  .species-icon{width:56px; height:56px; margin:0 auto 10px; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, var(--accent) 0%, var(--accent-dim) 55%, transparent 75%);}
  .species-card .name{font-family:'Fraunces', serif; font-weight:600; font-size:14.5px;}
  .species-card .jp{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-muted); margin-top:2px;}
  .species-card .count{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--accent); margin-top:4px;}
  .species-card.undoc{opacity:0.4;}
  .species-card.undoc .count{color:var(--text-muted);}

  /* Navigation par dots sur la page espèce */
  .dot-nav{display:flex; justify-content:center; gap:14px; margin:4px 0 18px; flex-wrap:wrap;}
  .dot-item{display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); transition:all .15s;}
  .dot-item.active .dot{background:var(--accent); border-color:var(--accent); box-shadow:0 0 8px rgba(232,163,61,0.5);}
  .dot-label{font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted);}
  .dot-item.active .dot-label{color:var(--accent);}

  .synth-box{background:var(--surface); border-left:3px solid var(--accent); border-radius:0 12px 12px 0; padding:14px 15px; font-size:13.3px; line-height:1.6;}
  .synth-box p{margin:0 0 11px;}
  .synth-box p:last-child{margin-bottom:0;}
  .synth-box strong{color:var(--accent); font-weight:600;}

  .typo-badges{display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 8px;}
  .typo-fam{font-family:'IBM Plex Mono', monospace; font-size:10.5px; padding:2px 8px; border-radius:999px; background:rgba(232,163,61,0.14); border:1px solid var(--accent); color:var(--accent);}
  .typo-dens{font-family:'IBM Plex Mono', monospace; font-size:10.5px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2);}
  .typo-dens.densflottant{color:#6FB1D6; border-color:#6FB1D6;}
  .typo-dens.denssinking{color:#C9A24B; border-color:#C9A24B;}
  .typo-dens.densheavysinking{color:#C4694F; border-color:#C4694F;}
  .typo-dens.densegi,.typo-dens.densvariable{color:var(--text-muted);}
  .typo-len{font-family:'IBM Plex Mono', monospace; font-size:10.5px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);}
  .typo-corr{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--text-muted); margin:-3px 0 8px; padding-left:2px;}
  .fam-block{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 13px; margin-bottom:9px;}
  .fam-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
  .fam-name{font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--accent);}
  .fam-count{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--text-muted);}
  .fam-meta{display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
  .fam-note{font-size:12px; color:var(--text-muted); margin:0 0 12px; font-style:italic;}
  .role-card,.tech-card,.color-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 13px; margin-bottom:8px;}
  .role-name,.tech-name,.color-name{font-family:'Fraunces',serif; font-size:15px; color:var(--accent); font-weight:600;}
  .role-fam,.tech-control{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-muted); margin:2px 0 6px;}
  .tech-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .tech-k{font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase; color:var(--text-muted); margin-bottom:2px;}
  .tech-v{font-size:12.5px; line-height:1.45;}
  .tech-not{margin-top:7px; padding-top:7px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-muted);}
  .color-axis-grid{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
  .color-axis{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px;}
  .color-axis .axis{font-family:'Fraunces',serif; color:var(--accent); font-size:14px; margin-bottom:5px;}
  .color-axis p{margin:3px 0; font-size:12px; line-height:1.4;}
  .color-matrix-row{display:grid; grid-template-columns:1.1fr 1.5fr; gap:8px; border-bottom:1px solid var(--border); padding:8px 0; font-size:12.5px; line-height:1.4;}
  .color-matrix-row:last-child{border-bottom:none;}
  .color-cond{font-weight:600;}
  .essence-box{background:rgba(232,163,61,0.08); border:1px solid var(--border); border-radius:12px; padding:12px 13px; margin-bottom:10px; font-size:13px; line-height:1.55;}
  .mech-block{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:11px;}
  .mech-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:8px;}
  .mech-fam{font-family:'Fraunces', serif; font-weight:600; font-size:16px; color:var(--accent);}
  .mech-esp{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--text-muted); text-align:right;}
  .mech-principe{font-size:13.5px; line-height:1.55; margin-bottom:9px;}
  .mech-principe p{margin:0;}
  .mech-corr{margin:0; padding-left:0; list-style:none;}
  .mech-corr li{font-size:13px; line-height:1.5; padding:6px 0 6px 14px; border-left:2px solid var(--border); margin-bottom:5px; position:relative;}
  .mech-corr li p{margin:0;}
  .mech-principe strong, .mech-corr strong{color:var(--text); font-weight:600;}
  .behav-block{background:var(--surface); border-left:3px solid var(--accent); border-radius:0 12px 12px 0; padding:12px 14px; margin-bottom:10px;}
  .behav-title{font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--accent); margin-bottom:6px;}
  .behav-txt{font-size:13.5px; line-height:1.6;}
  .behav-txt p{margin:0;}
  .behav-txt strong{color:var(--text); font-weight:600;}

  .ideal-win{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 11px; margin-bottom:6px;}
  .ideal-badge{font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; padding:2px 8px; border-radius:999px;}
  .ideal-badge.is-dawn{background:rgba(232,163,61,0.18); color:var(--accent);}
  .ideal-badge.is-dusk{background:rgba(120,110,200,0.2); color:#9b8fd6;}
  .ideal-tide{font-size:13px; color:var(--text);}
  .ideal-time{margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-muted);}
  .tide-curve{width:100%; height:88px; margin:6px 0 4px; display:block;}
  .mom-legend{display:flex; flex-direction:column; gap:5px; margin:4px 0 6px;}
  .mom-row{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .mom-sp{font-family:'Fraunces', serif; font-size:13px; color:var(--text); min-width:74px;}
  .mom-tag{font-family:'IBM Plex Mono', monospace; font-size:10px; padding:2px 7px; border-radius:999px; border:1px solid;}

  .section{margin-top:22px;}
  .section-title{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--accent); font-family:'IBM Plex Mono', monospace; margin:0 0 10px;}

  .fact-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:8px; font-size:13.5px; line-height:1.5;}
  .fact-meta{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .tag{font-family:'IBM Plex Mono', monospace; font-size:10.5px; background:var(--surface-2); color:var(--text-muted); padding:3px 7px; border-radius:6px;}
  .conf-mini{font-family:'IBM Plex Mono', monospace; font-size:10px; padding:2px 7px; border-radius:999px; margin-left:auto;}
  .conf-mini.high{background:rgba(95,168,122,0.18); color:var(--ok);}
  .conf-mini.mid{background:rgba(139,151,168,0.18); color:var(--text-muted);}
  .conf-mini.low{background:rgba(196,105,79,0.18); color:var(--flag);}

  .where-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .where-box{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px;}
  .where-box .dim-name{font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:6px;}
  .where-box .vals{font-size:13px; line-height:1.5;}

  .combo-block{margin-bottom:14px;}
  .combo-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px;}
  .combo-name{font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--accent);}
  .combo-desc{font-size:11.5px; color:var(--text-muted);}
  .lure-row{display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 13px; margin-bottom:6px;}
  .lure-name{font-size:13.5px; font-weight:500;}
  .lure-type{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--text-muted);}
  .lure-rank{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--accent); background:rgba(232,163,61,0.14); border-radius:999px; padding:2px 8px;}

  /* V6.1 — Travel Loadout + Terrain UX */
  .loadout-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:10px;}
  .loadout-rule{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--flag);text-align:right;}
  .loadout-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .loadout-card{background:linear-gradient(180deg,var(--surface),rgba(23,34,51,.72));border:1px solid var(--border);border-radius:15px;padding:13px;cursor:pointer;}
  .loadout-card.open{border-color:var(--accent);background:var(--surface-2);}
  .loadout-code{font-family:'Fraunces',serif;font-weight:700;font-size:22px;color:var(--accent);line-height:1;}
  .loadout-role{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;color:var(--text-muted);margin:4px 0 9px;}
  .loadout-rod{font-size:12.5px;font-weight:600;line-height:1.35;}
  .loadout-reel{font-size:11.5px;color:var(--text-muted);line-height:1.4;margin-top:3px;}
  .loadout-spec{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
  .gear-pill{font-family:'IBM Plex Mono',monospace;font-size:9.5px;border:1px solid var(--border);border-radius:999px;padding:3px 7px;background:var(--surface-2);color:var(--text-muted);}
  .gear-pill.primary{border-color:var(--accent);color:var(--accent);background:rgba(232,163,61,.10);}
  .gear-pill.ok{border-color:rgba(95,168,122,.55);color:var(--ok);}
  .gear-pill.high{border-color:rgba(196,105,79,.65);color:#d69a89;background:rgba(196,105,79,.08);}
  .gear-pill.off{border-color:rgba(196,105,79,.45);color:var(--flag);text-decoration:line-through;}
  .gear-detail{grid-column:1/-1;background:var(--surface-2);border:1px solid var(--accent);border-radius:12px;padding:13px 14px;}
  .gear-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0;}
  .gear-mini{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px;}
  .gear-mini .lab{font-family:'IBM Plex Mono',monospace;font-size:8.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px;}
  .gear-mini .val{font-size:12px;line-height:1.35;}

<script>
/* ============ MARÉES OFFICIELLES EMBARQUÉES (JMA) ============
   V5.1 : plus de constantes harmoniques fictives. L'app lit tides_2026.json,
   construit l'état montante/descendante entre PM/BM officielles et interpole
   uniquement pour dessiner la courbe. Les valeurs JMA sont des PRÉVISIONS
   astronomiques, pas des niveaux observés en temps réel. */
const JST_OFFSET_MS = 9*3.6e6;
let TIDES = {ports:{}, source_note:'Prévisions astronomiques JMA embarquées.'};
const PORTS = {
  shimizu: {label:'Shimizu Port (JMA)', lat:35.02, lng:138.49},
  fukuoka: {label:'Hakata (JMA)', lat:33.60, lng:130.40},
  itoshima:{label:'Itoshima · réf. Hakata JMA', lat:33.58, lng:130.20},
  kobe:    {label:'Kobe (JMA)', lat:34.69, lng:135.19},
  toba:    {label:'Toba JMA · proxy Ise-Shima', lat:34.48, lng:136.84},
  numazu:  {label:'Uchiura / Numazu (JMA)', lat:35.02, lng:138.88},
  tokyo:   {label:'Tokyo (JMA)', lat:35.65, lng:139.77},
  kashima: {label:'Kashima (JMA)', lat:35.94, lng:140.69},
};

function jstParts(d){
  const j = new Date(d.getTime()+JST_OFFSET_MS);
  return {y:j.getUTCFullYear(), m:j.getUTCMonth()+1, d:j.getUTCDate(), hh:j.getUTCHours(), mm:j.getUTCMinutes()};
}
function dateKeyJST(d){
  const x=jstParts(d), pad=n=>String(n).padStart(2,'0');
  return `${x.y}-${pad(x.m)}-${pad(x.d)}`;
}
function shiftDateKey(key, days){
  const [y,m,d]=key.split('-').map(Number);
  const z=new Date(Date.UTC(y,m-1,d+days));
  const pad=n=>String(n).padStart(2,'0');
  return `${z.getUTCFullYear()}-${pad(z.getUTCMonth()+1)}-${pad(z.getUTCDate())}`;
}
function dateFromJST(key, hm='12:00'){
  return new Date(`${key}T${hm}:00+09:00`);
}
function hrJST(d){
  if(!d) return null;
  const j=new Date(d.getTime()+JST_OFFSET_MS);
  return j.getUTCHours()+j.getUTCMinutes()/60;
}
function fmtJST(d){
  if(!d) return '—';
  const j=new Date(d.getTime()+JST_OFFSET_MS);
  return `${String(j.getUTCHours()).padStart(2,'0')}:${String(j.getUTCMinutes()).padStart(2,'0')}`;
}
function officialTideDay(portKey, dateOrKey){
  const key=typeof dateOrKey==='string' ? dateOrKey : dateKeyJST(dateOrKey);
  return TIDES && TIDES.ports && TIDES.ports[portKey] ? TIDES.ports[portKey][key] || null : null;
}
function tideEventsForDay(portKey, dateOrKey){
  const key=typeof dateOrKey==='string' ? dateOrKey : dateKeyJST(dateOrKey);
  const day=officialTideDay(portKey,key); if(!day) return [];
  const out=[];
  (day.high_tides||[]).forEach(e=>out.push({type:'PM', time:dateFromJST(key,e.time), height_cm:Number(e.height_cm)}));
  (day.low_tides||[]).forEach(e=>out.push({type:'BM', time:dateFromJST(key,e.time), height_cm:Number(e.height_cm)}));
  return out.sort((a,b)=>a.time-b.time);
}
function surroundingTideEvents(portKey,date,range=2){
  const key=dateKeyJST(date), out=[];
  for(let i=-range;i<=range;i++) out.push(...tideEventsForDay(portKey,shiftDateKey(key,i)));
  return out.sort((a,b)=>a.time-b.time);
}
function tideBracket(portKey,date){
  const ev=surroundingTideEvents(portKey,date,2);
  let prev=null,next=null;
  for(const e of ev){
    if(e.time<=date) prev=e;
    if(e.time>date){next=e;break;}
  }
  return {prev,next};
}
function tideState(portKey,date){
  const {prev,next}=tideBracket(portKey,date);
  if(!prev||!next) return null;
  const near=Math.min(Math.abs(date-prev.time),Math.abs(next.time-date));
  if(near<=20*6e4) return 'étale';
  if(prev.type==='BM' && next.type==='PM') return 'montante';
  if(prev.type==='PM' && next.type==='BM') return 'descendante';
  return null;
}
function tideHeight(portKey,date){
  const {prev,next}=tideBracket(portKey,date);
  if(!prev||!next || !Number.isFinite(prev.height_cm) || !Number.isFinite(next.height_cm)) return null;
  const span=next.time-prev.time; if(span<=0) return null;
  const p=Math.max(0,Math.min(1,(date-prev.time)/span));
  const mid=(prev.height_cm+next.height_cm)/2;
  const amp=(prev.height_cm-next.height_cm)/2;
  return mid + amp*Math.cos(Math.PI*p);
}
function dayExtremes(portKey,refDate){ return tideEventsForDay(portKey,refDate); }
function nextExtremes(portKey,date){
  return surroundingTideEvents(portKey,date,3).filter(e=>e.time>date).slice(0,2);
}
function tideSourceInfo(portKey,date){
  const day=officialTideDay(portKey,date); if(!day) return null;
  return {station:day.station||PORTS[portKey]?.label||portKey, code:day.station_code||null,
    proxy:day.proxy_note||null, url:day.source_url||null};
}

/* Soleil calculé localement pour le repère de faible lumière.
   V5 ajoute les lueurs civiles : plus utiles au pêcheur que le seul lever/coucher. */
function sunEvent(lat,lng,date,isSunrise,zenith=90.833){
  const rad=Math.PI/180, deg=180/Math.PI;
  const p=jstParts(date), base=Date.UTC(p.y,p.m-1,p.d), jan0=Date.UTC(p.y,0,0);
  const day=Math.floor((base-jan0)/864e5), lngHour=lng/15;
  const t=day+((isSunrise?6:18)-lngHour)/24;
  const M=(0.9856*t)-3.289;
  let L=M+(1.916*Math.sin(M*rad))+(0.020*Math.sin(2*M*rad))+282.634; L=(L+360)%360;
  let RA=deg*Math.atan(0.91764*Math.tan(L*rad)); RA=(RA+360)%360;
  RA+=(Math.floor(L/90)*90)-(Math.floor(RA/90)*90); RA/=15;
  const sinDec=.39782*Math.sin(L*rad), cosDec=Math.cos(Math.asin(sinDec));
  const cosH=(Math.cos(zenith*rad)-(sinDec*Math.sin(lat*rad)))/(cosDec*Math.cos(lat*rad));
  if(cosH>1||cosH<-1) return null;
  let H=isSunrise?360-deg*Math.acos(cosH):deg*Math.acos(cosH); H/=15;
  const T=H+RA-(0.06571*t)-6.622; let UT=(T-lngHour)%24; UT=(UT+24)%24;
  // NOAA renvoie ici une heure UTC modulo 24. Pour le Japon, l'aube tombe souvent
  // la veille en UTC : réaligner l'événement sur le jour civil JST demandé.
  let out=new Date(Date.UTC(p.y,p.m-1,p.d,Math.floor(UT),Math.round((UT%1)*60),0));
  const target=`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
  const got=dateKeyJST(out);
  if(got>target) out=new Date(out.getTime()-864e5);
  else if(got<target) out=new Date(out.getTime()+864e5);
  return out;
}
function sunTimes(lat,lng,date){
  return {
    civilDawn:sunEvent(lat,lng,date,true,96),
    sunrise:sunEvent(lat,lng,date,true,90.833),
    sunset:sunEvent(lat,lng,date,false,90.833),
    civilDusk:sunEvent(lat,lng,date,false,96),
  };
}

function idealWindows(portKey,date){
  if(!officialTideDay(portKey,date)) return [];
  const p=PORTS[portKey]; if(!p||p.lat==null) return [];
  const sun=sunTimes(p.lat,p.lng,date), wins=[], zones=[];
  if(sun.sunrise) zones.push({label:'aube',center:sun.sunrise});
  if(sun.sunset) zones.push({label:'crépuscule',center:sun.sunset});
  for(const z of zones){
    const start=new Date(z.center.getTime()-54e5), end=new Date(z.center.getTime()+54e5);
    let curStart=null,curState=null;
    for(let t=start.getTime();t<=end.getTime();t+=15*6e4){
      const st=tideState(portKey,new Date(t));
      if(st && st!=='étale'){
        if(curState!==st){ if(curStart) wins.push({light:z.label,tide:curState,from:new Date(curStart),to:new Date(t)}); curStart=t;curState=st; }
      } else if(curStart){ wins.push({light:z.label,tide:curState,from:new Date(curStart),to:new Date(t)});curStart=null;curState=null; }
    }
    if(curStart) wins.push({light:z.label,tide:curState,from:new Date(curStart),to:end});
  }
  return wins.filter(w=>(w.to-w.from)>=45*6e4);
}

/* Meilleurs moments par espèce, dérivés des observations (fréquence moment_jour).
   Renvoie un objet {espèce: [{moment, pct}]} trié, calculé une fois les données chargées. */
function bestMomentsBySpecies(){
  const acc = {};
  DATA.observations.forEach(o=>{
    const mj = o.tags && o.tags.moment_jour; if(!mj) return;
    const sp = o.species;
    (acc[sp] = acc[sp] || {})[mj] = (acc[sp][mj]||0)+1;
  });
  const out = {};
  Object.entries(acc).forEach(([sp,c])=>{
    const tot = Object.values(c).reduce((a,b)=>a+b,0);
    out[sp] = Object.entries(c).map(([m,n])=>({moment:m, pct:Math.round(100*n/tot)}))
      .sort((a,b)=>b.pct-a.pct);
  });
  return out;
}

function tidePreferencesBySpecies(){
  const acc={};
  DATA.observations.forEach(o=>{
    const st=o.tags&&o.tags.maree; if(!st) return;
    const sp=o.species; (acc[sp]=acc[sp]||{})[st]=(acc[sp][st]||0)+1;
  });
  return acc;
}
function tideRangeCm(portKey,key){
  const ev=tideEventsForDay(portKey,key).filter(e=>Number.isFinite(e.height_cm));
  if(ev.length<2) return 0;
  return Math.max(...ev.map(e=>e.height_cm))-Math.min(...ev.map(e=>e.height_cm));
}
function tideMovementIndex(portKey,date){
  const {prev,next}=tideBracket(portKey,date); if(!prev||!next) return 0;
  const span=next.time-prev.time; if(span<=0) return 0;
  const p=Math.max(0,Math.min(1,(date-prev.time)/span));
  return Math.sin(Math.PI*p); // proxy de vitesse de phase: 0 aux étales, 1 à mi-marée
}
function momentCenter(portKey,key,moment){
  const p=PORTS[portKey]; if(!p) return null;
  const d=dateFromJST(key,'12:00'), sun=sunTimes(p.lat,p.lng,d);
  if(moment==='aube') return sun.sunrise;
  if(moment==='crépuscule') return sun.sunset;
  if(moment==='nuit' && sun.sunset) return new Date(sun.sunset.getTime()+90*6e4);
  if(moment==='jour' && sun.sunrise && sun.sunset) return new Date((sun.sunrise.getTime()+sun.sunset.getTime())/2);
  return null;
}
function stayDatesForStop(s){
  const arr=(s.stay_dates&&s.stay_dates.length?s.stay_dates:[s.arrival_date]).filter(Boolean).slice(0,4);
  return arr.filter(k=>officialTideDay(s.port,k));
}
function tideDayScore(portKey,key,speciesList,stayDates){
  if(!officialTideDay(portKey,key)) return {score:null,label:'—',reason:'Pas de table officielle'};
  const best=bestMomentsBySpecies(), prefs=tidePreferencesBySpecies();
  let wsum=0,mov=0,pref=0,bestEval=null;
  (speciesList||[]).forEach(sp=>{
    const moments=(best[sp]&&best[sp].length?best[sp].filter(x=>x.pct>=20).slice(0,3):[{moment:'aube',pct:50},{moment:'crépuscule',pct:50}]);
    moments.forEach(m=>{
      const t=momentCenter(portKey,key,m.moment); if(!t) return;
      const w=Math.max(.15,m.pct/100), mv=tideMovementIndex(portKey,t), st=tideState(portKey,t);
      const pc=prefs[sp]||{}, pt=Object.values(pc).reduce((a,b)=>a+b,0);
      const ps=pt&&st ? (pc[st]||0)/pt : .5;
      mov+=mv*w; pref+=ps*w; wsum+=w;
      const e={sp,moment:m.moment,mv,st,t}; if(!bestEval||mv*w>bestEval.mv*bestEval.w) bestEval={...e,w};
    });
  });
  if(!wsum){mov=.5;pref=.5;wsum=1;} else {mov/=wsum;pref/=wsum;}
  const amp=tideRangeCm(portKey,key), maxAmp=Math.max(1,...(stayDates||[key]).map(k=>tideRangeCm(portKey,k)));
  const ampScore=Math.min(1,amp/maxAmp);
  const score=Math.max(0,Math.min(100,Math.round(55*mov+25*pref+20*ampScore)));
  const label=score>=80?'fort':score>=65?'bon':score>=50?'correct':'secondaire';
  const reason=bestEval ? `${bestEval.moment} ${bestEval.st||'phase inconnue'} · mouvement ${bestEval.mv>=.7?'soutenu':bestEval.mv>=.4?'moyen':'proche étale'} · marnage ${Math.round(amp)} cm` : `marnage ${Math.round(amp)} cm`;
  return {score,label,reason,movement:mov,preference:pref,amplitude:amp};
}

const MOMENT_COLORS = {
  aube:       '#E8A33D',   // ambre
  jour:       '#6FB1D6',   // bleu clair
  crépuscule: '#9b8fd6',   // violet
  nuit:       '#3f5170',   // bleu nuit
};

/* Convertit un moment_jour en plage horaire [hDébut,hFin] pour un jour donné, à partir du soleil réel. */
function momentRange(portKey, date, moment){
  const p = PORTS[portKey]; if(!p||p.lat==null) return null;
  const sun = sunTimes(p.lat, p.lng, date);
  const hr = d => hrJST(d);
  const sr = hr(sun.sunrise), ss = hr(sun.sunset);
  if(sr==null||ss==null) return null;
  switch(moment){
    case 'aube':       return [sr-1, sr+1.5];
    case 'crépuscule': return [ss-1.5, ss+1];
    case 'jour':       return [sr+1.5, ss-1.5];
    case 'nuit':       return [ss+1, sr-1+24]; // traverse minuit
    default: return null;
  }
}

function tideCurveSVG(portKey, refDate, speciesFilter){
  const base=refDate?new Date(refDate):new Date(), key=dateKeyJST(base), day=officialTideDay(portKey,key);
  if(!day) return `<div class="tide-warning">Pas de table JMA embarquée pour ${escHTML(key)}. La V5 refuse volontairement d'inventer une courbe.</div>`;
  const dayStart=dateFromJST(key,'00:00'), pts=[];
  for(let m=0;m<=24*60;m+=15){
    const t=new Date(dayStart.getTime()+m*6e4), h=tideHeight(portKey,t);
    if(h!=null) pts.push([m,h]);
  }
  const ev=tideEventsForDay(portKey,key), values=pts.map(p=>p[1]).concat(ev.map(e=>e.height_cm)).filter(Number.isFinite);
  if(values.length<2) return `<div class="tide-warning">Données officielles insuffisantes pour tracer ce jour.</div>`;
  const W=400,H=100,topPad=24,min=Math.min(...values),max=Math.max(...values),span=max-min||1;
  const X=m=>m/(24*60)*W, Y=h=>H-14-(h-min)/span*(H-topPad-22), hourToX=hr=>X((((hr%24)+24)%24)*60);
  let path='',pen=false;
  for(const [m,h] of pts){ path+=`${pen?'L':'M'}${X(m).toFixed(1)},${Y(h).toFixed(1)} `; pen=true; }
  const p=PORTS[portKey], sun=(p&&p.lat!=null)?sunTimes(p.lat,p.lng,base):{};
  let lightBands='',sunLines='';
  ['aube','crépuscule'].forEach(mo=>{
    const r=momentRange(portKey,base,mo); if(!r)return;
    const x1=hourToX(r[0]),x2=hourToX(r[1]);
    lightBands+=`<rect x="${Math.min(x1,x2).toFixed(1)}" y="${topPad}" width="${Math.abs(x2-x1).toFixed(1)}" height="${H-topPad-10}" fill="${MOMENT_COLORS[mo]}" opacity="0.09"/>`;
  });
  if(sun.sunrise){const x=hourToX(hrJST(sun.sunrise));sunLines+=`<line x1="${x}" y1="${topPad}" x2="${x}" y2="${H-10}" stroke="${MOMENT_COLORS.aube}" stroke-width=".8" stroke-dasharray="2,2"/>`;}
  if(sun.sunset){const x=hourToX(hrJST(sun.sunset));sunLines+=`<line x1="${x}" y1="${topPad}" x2="${x}" y2="${H-10}" stroke="${MOMENT_COLORS['crépuscule']}" stroke-width=".8" stroke-dasharray="2,2"/>`;}

  let speciesBands='',row=0; const best=bestMomentsBySpecies();
  const targets=speciesFilter&&speciesFilter.length?speciesFilter:Object.keys(best);
  targets.forEach(sp=>{
    const arr=best[sp]; if(!arr||!arr.length)return;
    arr.filter(x=>x.pct>=30).slice(0,2).forEach(({moment})=>{
      const r=momentRange(portKey,base,moment); if(!r)return; const y=2+row*5;
      if(moment==='nuit'){
        const a=hourToX(r[0]),b=hourToX(r[1]-24);
        speciesBands+=`<rect x="${a.toFixed(1)}" y="${y}" width="${(W-a).toFixed(1)}" height="3" rx="1" fill="${MOMENT_COLORS[moment]}"/><rect x="0" y="${y}" width="${b.toFixed(1)}" height="3" rx="1" fill="${MOMENT_COLORS[moment]}"/>`;
      }else{const a=hourToX(r[0]),b=hourToX(r[1]);speciesBands+=`<rect x="${Math.min(a,b).toFixed(1)}" y="${y}" width="${Math.abs(b-a).toFixed(1)}" height="3" rx="1" fill="${MOMENT_COLORS[moment]}"/>`;}
    }); row++;
  });
  const markers=ev.map(e=>{
    const x=X((hrJST(e.time))*60),y=Y(e.height_cm),anchor=x<35?'start':x>365?'end':'middle';
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="#E8A33D"/><text x="${x.toFixed(1)}" y="${Math.max(topPad+8,y-6).toFixed(1)}" font-size="7.5" fill="#8B97A8" text-anchor="${anchor}" font-family="monospace">${e.type} ${fmtJST(e.time)} · ${Math.round(e.height_cm)}cm</text>`;
  }).join('');
  return `<svg class="tide-curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${lightBands}${sunLines}<path d="${path.trim()}" fill="none" stroke="#E8A33D" stroke-width="1.6"/>${markers}${speciesBands}<text x="2" y="${H-2}" font-size="7" fill="#8B97A8" font-family="monospace">00h</text><text x="${W/2}" y="${H-2}" font-size="7" fill="#8B97A8" text-anchor="middle" font-family="monospace">12h</text><text x="${W-2}" y="${H-2}" font-size="7" fill="#8B97A8" text-anchor="end" font-family="monospace">24h JST</text></svg>`;
}

/* Légende des tags couleur espèce×moment, pour une liste d'espèces ciblées */
function momentLegend(speciesList){
  const best = bestMomentsBySpecies();
  const rows = (speciesList||[]).map(sp=>{
    const arr = best[sp]; if(!arr||!arr.length) return '';
    const top = arr.filter(x=>x.pct>=30).slice(0,2);
    const tags = top.map(({moment,pct})=>`<span class="mom-tag" style="background:${MOMENT_COLORS[moment]}22;color:${MOMENT_COLORS[moment]};border-color:${MOMENT_COLORS[moment]}">${moment} ${pct}%</span>`).join(' ');
    return `<div class="mom-row"><span class="mom-sp">${sp}</span>${tags}</div>`;
  }).filter(Boolean).join('');
  return rows ? `<div class="mom-legend">${rows}</div>` : '';
}

function escHTML(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(v){ return escHTML(v).replace(/`/g,'&#96;'); }
function normalizeLure(v){ return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function findTypology(lure){
  const n=normalizeLure(lure); if(!n||n.length<4) return null;
  let best=null,bestLen=0;
  for(const [key,t] of Object.entries(LURETYPO||{})){
    const variants=[normalizeLure(key),normalizeLure(t&&t.modele)].filter(Boolean);
    for(const v of variants){ if(v.length>=4 && (n===v || n.includes(v) || v.includes(n)) && v.length>bestLen){best=t;bestLen=v.length;} }
  }
  return best;
}
function hydrateTypologies(){
  for(const o of DATA.observations||[]){
    if(!o.recommendation) continue;
    if(!o.recommendation.typology && o.recommendation.lure){ const t=findTypology(o.recommendation.lure); if(t) o.recommendation.typology=t; }
  }
}

async function fetchJSONOptional(url,fallback){

}

function briefMd(s){
  // Échappe d'abord le contenu, puis applique un sous-ensemble markdown maîtrisé.
  const safe=escHTML(s||'').replace(/\[#(\d+)\]/g,'<span class="obs-ref">[#$1]</span>');
  const lines=safe.split('\n'); let html='',inList=false;
  for(let ln of lines){
    if(/^##\s+/.test(ln)){if(inList){html+='</ul>';inList=false;}html+=`<div class="brief-h">${ln.replace(/^##\s+/,'')}</div>`;}
    else if(/^#\s+/.test(ln)){if(inList){html+='</ul>';inList=false;}html+=`<div class="brief-h1">${ln.replace(/^#\s+/,'')}</div>`;}
    else if(/^-\s+/.test(ln)){if(!inList){html+='<ul class="brief-ul">';inList=true;}html+=`<li>${ln.replace(/^-\s+/,'').replace(/\*(.+?)\*/g,'<em>$1</em>')}</li>`;}
    else if(ln.trim()===''){if(inList){html+='</ul>';inList=false;}}
    else{if(inList){html+='</ul>';inList=false;}html+=`<p>${ln.replace(/\*(.+?)\*/g,'<em>$1</em>')}</p>`;}
  }
  if(inList)html+='</ul>'; return html;
}

function intelBlock(s,limit=5){

  const chosen=[...intel].sort((a,b)=>score(b)-score(a)).slice(0,limit);
  return `<div class="intel-list">${chosen.map(x=>`<div class="intel-item"><div class="intel-meta"><span class="intel-cat">${escHTML(x.category)}</span><span class="intel-conf">niveau ${Number(x.confidence_level||0)}/4</span></div>${escHTML(x.text)}<div class="intel-src">${escHTML(x.source||'source')}</div></div>`).join('')}</div>`;

function panelComportement(sp, obs){
  const blocks=(SYNTH.behavior&&SYNTH.behavior[sp.name_fr])||[];
  const divergences=findConsensusPairs(obs);
  const sourceCount=new Set(obs.map(o=>o.source).filter(Boolean)).size;

/* Désaccords / consensus : similarité de conditions + similarité de recommandation,
   PAS de correspondance texte exacte. Mots-clés partagés + tags à vocabulaire
   contrôlé identiques comptent comme "conditions proches". */
const COND_DIMS = ["maree","moment_jour","couleur_eau","spot_type","saison","pression_atmo"];
const STOPWORDS = new Set(['les','des','une','un','le','la','de','du','pour','dans','sur','avec','par',
  'est','sont','plus','tres','peu','vers','apres','avant','entre','depuis','lorsque','comme','tout',
  'cette','ces','leur','leurs','ils','elle','qui','que','son','ses','sans','pendant','environ','aussi',
  'ainsi','ete','etre','fait','faire','tant','meme','encore','deja','alors','donc','mais','ou','et',
  // domaine : trop génériques pour signaler une vraie similarité de conditions
  'attaque','leurre','poisson','poissons','activite','presence','pris','prise','pecheur','recherche',
  'anime','animee','presente','presentation','recuperation','zone','secteur','session']);

function normWords(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>2 && !STOPWORDS.has(w));
}
function jaccard(a,b){
  const A=new Set(normWords(a)), B=new Set(normWords(b));
  if(!A.size||!B.size) return {score:0, inter:0};
  let inter=0; A.forEach(w=>{ if(B.has(w)) inter++; });
  return {score: inter/(A.size+B.size-inter), inter};
}

function conditionMatch(a,b){
  let controlled=0;
  ["maree","moment_jour","couleur_eau","pression_atmo"].forEach(d=>{
    if(a.tags[d] && a.tags[d]===b.tags[d]) controlled++;
  });
  const textA = [a.tags.spot_type,a.tags.comportement].filter(Boolean).join(' ');
  const textB = [b.tags.spot_type,b.tags.comportement].filter(Boolean).join(' ');
  const text = jaccard(textA, textB);
  // au moins 2 tags à vocabulaire contrôlé identiques (un seul tag isolé comme
  // "nuit" tout seul ne suffit pas à dire que deux sessions sont comparables),
  // OU au moins 2 mots-clés significatifs partagés sur spot/comportement
  return {controlled, text: text.score, related: controlled>=2 || (text.score>=0.2 && text.inter>=2)};
}

/* Niveau d'activité décrit dans une observation — sert à requalifier les faux désaccords :
   deux recos différentes pour des niveaux d'activité différents = adaptation du pêcheur, pas contradiction */
function activityLevel(o){
  const t = ((o.tags.comportement||'')+' '+(o.text||'')).toLowerCase();
  const low = ['peu actif','faible activité','méfian','sollicit','sans réaction','ne réagi','refus','difficile','poursuite sans','suit sans','calé mais inactif','activité réduite','moins actif'];
  const high = ['forte activité','très actif','chasse','agressi','boil','frénési','activité soutenue','forte concentration','attaques répétées','poissons actifs'];
  const isLow = low.some(k=>t.includes(k)), isHigh = high.some(k=>t.includes(k));
  if(isLow && !isHigh) return 'faible';
  if(isHigh && !isLow) return 'forte';
  return null;
}

/* Typologie d'ACTION — le GESTE réel une fois le leurre à l'eau.
   V5 suit la même grammaire que l'onglet Animation : on ne fusionne plus un one-pitch,
   un lift-and-fall, une chute seule et un linéaire simplement parce qu'ils peuvent tous
   utiliser un jig. Une observation reçoit UNE mécanique dominante, la plus spécifique. */
const ACTION_PATTERNS = [
  {cat:"one-pitch / jigging (canne + moulinet synchronisés)",
   any:["one-pitch","one pitch","fast pitch","remontée rythmée depuis le fond","remonte en one-pitch","ジャカ巻き","pitch jigging"]},
  {cat:"lift-and-fall (lift de canne + retombée)",
   any:["lift-and-fall","lift and fall","soulever le montage","relever puis","décoll","remontées et descentes en laissant le leurre retomber","lift puis fall","lift puis chute"]},
  {cat:"fall / chute (gravité + tension de ligne)",
   any:["free fall","tension fall","カーブフォール","descente en courbe","shimmy fall","back-roll","rolling fall","laisser l'egi retomber","laisser descendre","chute horizontale","laisser tomber","chute contrôlée","10 secondes de chute","allonger le temps de descente","descente stable","descente progressive","sur la chute","pendant la chute"]},
  {cat:"surface — dog-walk / pop / dive (canne + reprise de mou)",
   any:["dog walk","dog-walk","popping","petits pops","popper","plongée sur traction","diving pencil","誘い出し","induction","zigzag de surface"]},
  {cat:"jerk / twitch (impulsion de canne)",
   any:["jerk","twitch","dart","écart latéral","glissade latérale","impulsion de canne","coups de scion","short jerk","long jerk"]},
  {cat:"stop-and-go (moulinet + arrêts)",
   any:["stop-and-go","stop and go","tours de manivelle puis arrêt","tours puis arrêt","récupération puis arrêt","récupérer puis stopper","marquer un arrêt","récupération entrecoupée de pauses"]},
  {cat:"dérive / dead drift (courant + bannière)",
   any:["dériv","dead drift","accompagner le courant","laisser filer","vitesse de dérive","lancer en amont"]},
  {cat:"linéaire (moulinet continu)",
   any:["linéaire","récupération continue","récupération régulière","récupération lente","récupération très lente","dead slow","récupération simple","récupération rapide","tour de manivelle toutes les","digital retrieve","prospection large en récupération"]},
];

/* Renvoie LA catégorie d'action dominante d'une obs (la première règle qui matche, ordre = spécificité),
   ou null si le geste n'est pas décrit. */
function actionCategory(o){
  const rec = o.recommendation || {};
  const blob = ((rec.animation||'') + ' ' + (o.tags && o.tags.comportement || '')).toLowerCase();
  if(!blob.trim()) return null;
  for(const p of ACTION_PATTERNS){
    if(p.any.some(k=>blob.includes(k.toLowerCase()))) return p.cat;
  }
  return null;
}

function findConsensusPairs(obs){
  const recos = technicalObservations(obs).filter(o=>o.recommendation.lure);
  const pairs = [];
  for(let i=0;i<recos.length;i++){
    for(let j=i+1;j<recos.length;j++){
      const a=recos[i], b=recos[j];
      if(a.source===b.source) continue;
      const cond = conditionMatch(a,b);
      if(!cond.related) continue;

      const lureSim = jaccard(a.recommendation.lure, b.recommendation.lure).score;
      const famA = a.recommendation.typology && a.recommendation.typology.famille;
      const famB = b.recommendation.typology && b.recommendation.typology.famille;
      const sameFamille = famA && famB && famA===famB;
      const actA = actionCategory(a), actB = actionCategory(b);
      const sameAction = actA && actB && actA===actB;   // MÊME geste exact, pas un chevauchement flou

      let type, actKind=null, levA=null, levB=null;
      if(lureSim>=0.25 || sameFamille){
        type = 'consensus';                        // même leurre / même famille
      } else if(sameAction){
        type = 'consensus-action';                 // leurres différents MAIS strictement le même geste
        actKind = actA;
      } else {
        levA = activityLevel(a); levB = activityLevel(b);
        if(levA && levB && levA!==levB){ type = 'adaptation'; }
        else { type = 'divergence'; }
      }
      pairs.push({a, b, cond, lureSim, type, actKind, actA, actB, levA, levB});
    }
  }
  const rank = {consensus:0,'consensus-action':1,adaptation:2,divergence:3};
  return pairs.sort((p,q)=> (rank[p.type]-rank[q.type]) || ((q.cond.controlled+q.cond.text)-(p.cond.controlled+p.cond.text)));
}

function conditionLabel(pair){
  const bits = [];
  ["maree","moment_jour","couleur_eau","pression_atmo"].forEach(d=>{
    if(pair.a.tags[d] && pair.a.tags[d]===pair.b.tags[d]) bits.push(`${DIM_LABELS[d]}: ${pair.a.tags[d]}`);
  });
  if(pair.cond.text >= 0.2) bits.push('conditions similaires (spot/comportement)');
  return bits.join(' · ') || 'conditions proches';
}

function consensusCard(pair){
  const labels = {consensus:'Consensus', 'consensus-action':"Consensus d'action", divergence:'Désaccord', adaptation:"Adaptation à l'activité"};
  const badge = labels[pair.type];
  let note = '';
  if(pair.type==='adaptation'){
    note = `<div class="diverge-conditions" style="color:#7FA8C9">Pas une contradiction : réponses à deux états d'activité (${pair.levA} vs ${pair.levB})</div>`;
  } else if(pair.type==='consensus-action'){
    note = `<div class="diverge-conditions" style="color:#5FA87A">Même geste à l'eau — <strong>${pair.actKind}</strong> — avec deux leurres différents. Ce qui compte, c'est l'action, pas le modèle.</div>`;
  }
  const opt = (o,lev) => `<div class="diverge-opt">
    <div class="who">${o.source} (conf ${o.confidence.toFixed(2)})${lev?` · poissons ${lev}s`:''}</div>
    ${o.recommendation.lure}${o.recommendation.animation?' — '+o.recommendation.animation:''}${o.recommendation.color?' — '+o.recommendation.color:''}
  </div>`;
  return `<div class="consensus-pair is-${pair.type}">
    <span class="consensus-badge is-${pair.type}">${badge}</span>
    <div class="diverge-conditions">${conditionLabel(pair)}</div>
    ${note}
    ${opt(pair.a, pair.type==='adaptation'?pair.levA:null)}${opt(pair.b, pair.type==='adaptation'?pair.levB:null)}
  </div>`;
}

/* ============ QCM ============ */
function startQCM(){ qcmState = {step:0, answers:{}}; renderQCM(); }

async function fetchPressure(expectedStep){
  const zone=document.getElementById('qcmZone'), note=zone&&zone.querySelector('.qcm-auto');
  if(note) note.textContent='Relevé en cours…';
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:6000}));
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=pressure_msl`);
    if(!r.ok) throw new Error(`HTTP ${r.status}`); const j=await r.json(), hpa=j.current.pressure_msl;
    const bucket=hpa<1013?'basse':hpa<=1020?'moyenne':'haute';
    // Réponse auto ignorée si l'utilisateur a déjà répondu/changé d'étape.
    if(qcmState && qcmState.step===expectedStep && QCM_STEPS[expectedStep]?.dim==='pression_atmo') selectQCMAnswer('pression_atmo',bucket,expectedStep);
  }catch(e){ if(qcmState&&qcmState.step===expectedStep&&note) note.textContent='Relevé impossible — choisis manuellement.'; }
}

function renderQCM(){
  const zone = document.getElementById('qcmZone');
  if(!qcmState){ zone.innerHTML=''; return; }
  if(qcmState.step >= QCM_STEPS.length){ renderQCMResults(); return; }

  const step = QCM_STEPS[qcmState.step];
  let suggestion = null, note = '';

  if(step.tide){
    const ap = getActivePort();
    if(ap && PORTS[ap]){
      suggestion = tideState(ap, new Date());
      note = suggestion ? `<div class="qcm-auto">JMA embarqué — ${PORTS[ap].label}, maintenant. Tape une autre option pour corriger.</div>` : `<div class="qcm-auto">Pas de table JMA embarquée pour aujourd’hui — choisis manuellement.</div>`;
    } else {
      note = `<div class="qcm-auto">Astuce : active un port depuis "Où je pêche" pour utiliser la table JMA embarquée quand la date est couverte.</div>`;
    }
  }
  if(step.auto){
    note = `<div class="qcm-auto">Relevé auto via Open-Meteo…</div>`;
  }

  if(step.multi){
    const sel = qcmState.obsSel || [];
    zone.innerHTML = `<div class="qcm-panel">
      <div class="qcm-step-label">Étape ${qcmState.step+1} / ${QCM_STEPS.length} — lecture du spot</div>
      <p class="qcm-question">${step.question}</p>
      <div class="obs-chips">
        ${step.options.map(o=>`<button class="obs-chip ${sel.includes(o)?'on':''}" onclick="toggleObsChip('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
      </div>
      <button class="qcm-cta" style="margin-top:14px" onclick="validateObs()">${sel.length?`Valider (${sel.length} indice${sel.length>1?'s':''}) →`:'Rien de notable → résultats'}</button>
    </div>`;
    return;
  }

  zone.innerHTML = `<div class="qcm-panel">
    <div class="qcm-step-label">Étape ${qcmState.step+1} / ${QCM_STEPS.length}</div>
    <p class="qcm-question">${step.question}</p>
    <div class="qcm-options">
      ${step.options.map(o=>`<button class="qcm-opt ${o===suggestion?'suggested':''}" onclick="selectQCMAnswer('${step.dim}','${o}')">${o}</button>`).join('')}
    </div>
    ${note}
  </div>`;

  if(step.auto) fetchPressure(qcmState.step);
}

function toggleObsChip(cat){
  if(!qcmState) return;
  qcmState.obsSel = qcmState.obsSel || [];
  const i = qcmState.obsSel.indexOf(cat);
  if(i>=0) qcmState.obsSel.splice(i,1); else qcmState.obsSel.push(cat);
  renderQCM();
}
function validateObs(){
  if(!qcmState) return;
  qcmState.answers.observation = qcmState.obsSel || [];
  qcmState.step += 1;
  renderQCM();
}

function selectQCMAnswer(dim, value, expectedStep=null){
  if(!qcmState) return;
  if(expectedStep!==null && qcmState.step!==expectedStep) return;
  const step=QCM_STEPS[qcmState.step];
  if(!step || step.dim!==dim) return;
  qcmState.answers[dim] = String(value).toLowerCase();
  qcmState.step += 1;
  renderQCM();
}

function qcmColorGuideHTML(sp,answers){
  const water=answers.couleur_eau, light=answers.moment_jour, seen=answers.observation||[];
  const bait=seen.includes('fourrage visible / oiseaux');
  const transition=light==='aube'||light==='crépuscule', night=light==='nuit';
  let start='', alt='';
  if(night){
    if(water==='claire'){
      start='sous éclairage : naturel/transparent; sans éclairage : silhouette sombre ou pearl/white';
      alt='glow ponctuel si cohérent avec la technique, sans confondre glow et fluorescence UV';
    }else{
      start='opaque pearl/white ou silhouette sombre bien lisible';
      alt='chart/rose en accent ou glow ponctuel; réduire le signal si suivis sans attaque';
    }
  }else if(water==='claire'){
    start=transition?'translucide/pearl ou naturel avec contraste contenu':'ghost / transparent / naturel bait';
    alt=transition?'accent rose/chart fluorescent ou UV-reactif, puis réduire quand la lumière monte':'un peu de flash si activité; plus opaque si ciel se ferme';
  }else if(water==='verte'){
    start=transition?'pearl + rose/magenta ou chartreuse bien lisible':'silver/gold naturel + accent rose ou chart';
    alt=transition?'rose = contraste de teinte; chart = lisibilité. Tester les deux niveaux de signal.':'naturel/flash si chasse sur bait; plus discret si pression forte';
  }else if(water==='trouble'){
    start=transition?'opaque pearl/blanc, chartreuse/jaune ou rose/orange high-appeal':'opaque/pearl + flash ou chartreuse';
    alt='garder une option sombre/mate pour une silhouette franche si le flash ne produit rien';
  }else{
    start=transition?'opaque/pearl ou accent fluo/UV avec une option naturelle':'naturel/ghost comme base';
    alt='bracketer avec une option plus discrète et une plus visible';
  }
  const baitLine=bait?'Fourrage visible : fais d’abord matcher silhouette/taille, couche et cadence; la nuance exacte vient après. ':'';
  return `<div class="essence-box" style="margin:10px 0"><strong>Couleur — point de départ</strong> <span style="color:var(--text-muted);font-size:10px">(aide de décision)</span><br>${escHTML(baitLine)}Départ : <strong>${escHTML(start)}</strong>. Alternative : ${escHTML(alt)}.</div>`;
}

function renderQCMResults(){
  const obs = technicalObservations(speciesObservations(currentSpeciesId));
  const answers = qcmState.answers;
  const obsSel = answers.observation || [];
  const scored = obs.map(o=>{
    const matchedDims = [];
    Object.entries(answers).forEach(([d,v])=>{
      if(d==='observation') return;
      if(o.tags[d] && o.tags[d].toLowerCase()===v) matchedDims.push(`${DIM_LABELS[d]||d}: ${v}`);
    });
    const matchedObs = obsMatchCategories(o, obsSel);
    return {o, matchedDims, matchedObs, matches: matchedDims.length + matchedObs.length};
  }).filter(r=>r.matches>0).sort((a,b)=> b.matches-a.matches || b.o.confidence-a.o.confidence);

  const zone = document.getElementById('qcmZone');
  const condBits = Object.entries(answers).filter(([d])=>d!=='observation').map(([d,v])=>`${DIM_LABELS[d]||d}=${v}`);
  if(obsSel.length) condBits.push(`lecture: ${obsSel.join(' + ')}`);
  const condLine = condBits.join(' · ');
  if(!scored.length){
    zone.innerHTML = `<div class="qcm-panel">
      <div class="qcm-step-label">${condLine}</div>
      ${qcmColorGuideHTML(DATA.species.find(s=>s.id===currentSpeciesId),answers)}
      <div class="empty">Pas de recommandation sourcée pour cette combinaison.<br>Réfère-toi au top leurres — et logge ta session : elle deviendra la première source terrain pour ces conditions.</div>
      <span class="restart-btn" onclick="startQCM()">↺ Refaire</span></div>`;
    return;
  }
  zone.innerHTML = `<div class="qcm-panel">
    <p class="qcm-step-label">${condLine}</p>
    ${qcmColorGuideHTML(DATA.species.find(s=>s.id===currentSpeciesId),answers)}
    ${scored.map(({o,matchedDims,matchedObs})=>`
      <div class="reco-card">
        ${gearBadgeHTML(DATA.species.find(s=>s.id===currentSpeciesId),o)}
        <div class="reco-lure">${escHTML(o.recommendation.lure||'Config')}</div>
        ${typoBadge(o)}
        <div class="match-chips">
          ${matchedObs.map(c=>`<span class="match-chip is-spot">👁 ${c}</span>`).join('')}
          ${matchedDims.map(c=>`<span class="match-chip">${c}</span>`).join('')}
        </div>
        ${o.recommendation.color?`<div class="reco-row"><span class="k">Couleur</span>${escHTML(o.recommendation.color)}</div>`:''}
        ${o.recommendation.animation?`<div class="reco-row"><span class="k">Animation</span>${escHTML(o.recommendation.animation)}</div>`:''}
        ${o.recommendation.leader?`<div class="reco-row"><span class="k">Bas de ligne</span>${escHTML(o.recommendation.leader)}</div>`:''}
        <div class="reco-source">${escHTML(o.source)} (${escHTML(o.source_type)}) · confiance ${Number(o.confidence).toFixed(2)}</div>
      </div>`).join('')}
    <span class="restart-btn" onclick="startQCM()">↺ Refaire</span></div>`;
}

/* ============ LOG TERRAIN ============ */
function logFormHTML(sp){
  const last = qcmState && qcmState.answers ? qcmState.answers : {};
  const condNote = Object.keys(last).length
    ? `Conditions reprises du QCM : ${Object.entries(last).map(([d,v])=>`${DIM_LABELS[d]||d}=${Array.isArray(v)?v.join(' + '):v}`).join(' · ')}`
    : 'Fais le QCM d\u2019abord pour capturer les conditions automatiquement (sinon la session part sans conditions).';
  return `<div class="log-form">
    <label>Leurre utilisé</label>
    <input id="logLure" placeholder="ex: sinking pencil 28 g, iwashi">
    <label>Combo utilisé</label>
    <select id="logCombo">${['M','MH'].map(code=>`<option value="${code}" ${gearPlanFor(sp.name_fr,null).code===code?'selected':''}>${code} · ${escHTML((gearSetup(code)?.setup?.rod?.model)||code)} · PE${escHTML(gearSetup(code)?.setup?.line?.size||'')}</option>`).join('')}</select>
    <label>Poids total lancé (g) · optionnel</label>
    <input id="logWeight" type="number" inputmode="decimal" min="0" max="50" step="0.5" placeholder="poids leurre + montage">
    <label>Résultat</label>
    <div class="row3">
      <button onclick="setLogResult(this,'prise')">Prise</button>
      <button onclick="setLogResult(this,'suivi')">Suivi/raté</button>
      <button onclick="setLogResult(this,'rien')">Rien</button>
    </div>
    <label>Notes (taille, comportement, spot précis…)</label>
    <textarea id="logNotes" rows="2"></textarea>
    <div class="qcm-auto" style="margin-top:8px">${condNote}</div>
    <button class="log-save" onclick="saveLog('${sp.name_fr}')">Enregistrer la session</button>
    <div class="log-count">${getSessions().length} session(s) en mémoire locale</div>
  </div>`;
}

function setLogResult(btn, val){
  logResult = val;
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

function saveLog(speciesName){
  const lure = document.getElementById('logLure').value.trim();
  const combo = document.getElementById('logCombo').value;
  const rawWeight=document.getElementById('logWeight').value;
  const castWeight=rawWeight===''?null:Number(rawWeight);
  if(!lure || !logResult){ alert('Leurre + résultat obligatoires.'); return; }
  if(castWeight!==null && (!Number.isFinite(castWeight)||castWeight>maxLureWeight())){ alert(`Plafond projet : ${maxLureWeight()} g maximum.`); return; }
  const sessions = getSessions();
  const now=new Date(), jp=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(now).replace('T',' ');
  sessions.push({
    date: jp,
    timezone: 'Asia/Tokyo',
    created_at_utc: now.toISOString(),
    species: speciesName.toLowerCase(),
    conditions: JSON.parse(JSON.stringify((qcmState && qcmState.answers) ? qcmState.answers : {})),
    port: getActivePort() || null,
    lure, combo, cast_weight_g: castWeight, result: logResult,
    notes: document.getElementById('logNotes').value.trim(),
  });
  saveSessions(sessions);
  logResult = null;
  const sp = DATA.species.find(s=>s.id===currentSpeciesId);
  document.getElementById('logZone').innerHTML = logFormHTML(sp);
}

function exportSessions(){
  const data = JSON.stringify(getSessions(), null, 2);
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);
  a.download = 'sessions-terrain.json';
  a.click();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// Filet de sécurité : jamais d'écran blanc muet. Si le démarrage plante ou traîne, on affiche un message + reset.
function showFatal(msg){
  document.getElementById('mainZone').innerHTML =
    '<div style="padding:24px;font-family:sans-serif;color:#ddd">'
    + '<h3 style="color:#E8A33D">Chargement impossible</h3>'
    + '<p style="opacity:.8;font-size:14px">'+escHTML(msg||'')+'</p>'
    + '<button onclick="resetApp()" style="margin-top:12px;padding:10px 16px;background:#E8A33D;border:none;border-radius:8px;font-weight:600">Vider le cache et recharger</button>'
    + '</div>';
}
function resetApp(){
  if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); }
  if(window.caches){ caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).then(()=>location.reload(true)); }
  else location.reload(true);
}
window.addEventListener('error', (e)=>{
  if(!document.getElementById('mainZone').innerHTML.trim()) showFatal(e.message);
});
const _bootTimer = setTimeout(()=>{
  if(!document.getElementById('mainZone').innerHTML.trim()) showFatal('Délai dépassé au chargement des données.');
}, 6000);

(async ()=>{
  try{ await loadData(); }
  catch(e){ showFatal(e.message); }
  finally{ clearTimeout(_bootTimer); }
})();
</script>
